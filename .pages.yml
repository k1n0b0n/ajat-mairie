# Interface d'édition (Pages CMS) : voir specs/001-site-mairie-ajat/contracts/pages-cms-config.md
# La configuration est lue par branche : la branche « redaction » doit contenir ce fichier à jour.
settings:
  hide: true
  commit:
    identity: app
    templates:
      create: "Ajoute {path} par {userName}"
      update: "Modifie {path} par {userName}"
      delete: "Supprime {path} par {userName}"
      rename: "Renomme {oldPath} en {newPath} par {userName}"

media:
  - name: couvertures
    label: Images de couverture
    input: src/assets/images
    output: /src/assets/images
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: images-texte
    label: Images dans le texte
    input: public/images
    output: /images
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: comptes-rendus
    label: Comptes rendus (PDF)
    input: public/documents/comptes-rendus
    output: /documents/comptes-rendus
    extensions: [pdf]
    rename: safe

content:
  - name: actualites
    label: Actualités
    type: collection
    path: src/content/actualites
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      primary: title
      sort: publishDate
      order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
        options:
          minlength: 3
          maxlength: 120
      - name: summary
        label: Résumé (une ou deux phrases)
        type: text
        required: true
        description: 200 caractères au maximum. Il s'affiche dans la liste des actualités.
        options:
          maxlength: 200
      - name: publishDate
        label: Date de publication
        type: date
        description: Une date à venir programme la publication (visible à partir de ce jour, après validation).
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Brouillon (ne pas publier)
        type: boolean
        default: true
        description: Décochez cette case quand le texte est prêt à être relu.
      - name: cover
        label: Image de couverture (facultative)
        type: object
        fields:
          - name: image
            label: Image
            type: image
            options:
              media: couvertures
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: alt
            label: Description de l'image
            type: string
            description: Décrivez ce que montre l'image pour les personnes qui ne la voient pas. Obligatoire si vous mettez une image.
      - name: body
        label: Texte
        type: rich-text
        options:
          format: markdown
          media: images-texte
          path: public/images
          extensions: [jpg, jpeg, png, webp]
          rename: safe

  - name: comptes-rendus
    label: Comptes rendus du conseil
    type: collection
    path: src/content/comptes-rendus
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      primary: title
      sort: meetingDate
      order: desc
    fields:
      - name: title
        label: Titre (par exemple « Conseil municipal du 12 octobre 2026 »)
        type: string
        required: true
        options:
          minlength: 3
          maxlength: 120
      - name: meetingDate
        label: Date de la séance
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: file
        label: Fichier PDF du compte rendu
        type: file
        required: true
        description: Un seul fichier PDF. Évitez les fichiers de plus de 3 Mo.
        options:
          media: comptes-rendus
          extensions: [pdf]
          rename: safe
      - name: draft
        label: Brouillon (ne pas publier)
        type: boolean
        default: true
        description: Décochez cette case quand le compte rendu est prêt à être relu.

  - name: demarches
    label: Démarches
    type: collection
    path: src/content/demarches
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Titre de la démarche
        type: string
        required: true
        options:
          minlength: 3
          maxlength: 120
      - name: summary
        label: Résumé (une phrase)
        type: text
        required: true
        options:
          maxlength: 200
      - name: officialUrl
        label: Adresse de la fiche officielle (commence par https://)
        type: string
        required: true
        pattern:
          regex: "^https://.+"
          message: "L'adresse doit commencer par https://"
      - name: documents
        label: Pièces utiles (facultatif)
        type: string
        list: true
      - name: order
        label: Ordre d'affichage (1 = en premier)
        type: number
      - name: draft
        label: Brouillon (ne pas publier)
        type: boolean
        default: true
      - name: body
        label: Explications
        type: rich-text
        options:
          format: markdown
          media: images-texte
          path: public/images
          extensions: [jpg, jpeg, png, webp]
          rename: safe

  - name: associations
    label: Associations
    type: collection
    path: src/content/associations
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      primary: title
    fields:
      - name: title
        label: Nom de l'association
        type: string
        required: true
      - name: activity
        label: Activité (une phrase)
        type: string
        required: true
      - name: contacts
        label: Contacts (au moins un)
        type: object
        list: true
        fields:
          - name: type
            label: Type
            type: select
            required: true
            options:
              values:
                - { name: tel, label: Téléphone }
                - { name: email, label: Courriel }
                - { name: adresse, label: Adresse }
                - { name: site, label: Site internet }
          - name: value
            label: Valeur
            type: string
            required: true
      - name: consent
        label: J'ai l'accord de l'association pour publier ces coordonnées
        type: boolean
        default: false
        description: Obligatoire pour pouvoir publier. Ne cochez pas sans accord.
      - name: draft
        label: Brouillon (ne pas publier)
        type: boolean
        default: true
      - name: body
        label: Présentation (facultatif)
        type: rich-text
        options:
          format: markdown
          media: images-texte
          path: public/images
          extensions: [jpg, jpeg, png, webp]
          rename: safe

  - name: salle-des-fetes
    label: Salle des fêtes
    type: file
    path: src/content/donnees/salle-des-fetes.yml
    format: yaml
    fields:
      - name: salle
        label: Salle des fêtes
        type: object
        fields:
          - name: description
            label: Présentation
            type: text
          - name: capacity
            label: Capacité (nombre de personnes)
            type: number
          - name: conditions
            label: Conditions de location
            type: text
            description: Séparez les paragraphes par une ligne vide.
          - name: rates
            label: Tarifs
            type: object
            list: true
            fields:
              - name: label
                label: Prestation (par exemple « Week-end habitants »)
                type: string
                required: true
              - name: amount_eur
                label: Montant en euros
                type: number
                required: true
              - name: unit
                label: Unité (par exemple « par jour »)
                type: string
                required: true

  - name: liens
    label: Liens utiles
    type: file
    path: src/content/donnees/liens.yml
    format: yaml
    fields:
      - name: liens
        label: Liens
        type: object
        fields:
          - name: items
            label: Liens
            type: object
            list: true
            fields:
              - name: label
                label: Texte du lien
                type: string
                required: true
              - name: url
                label: Adresse (commence par https://)
                type: string
                required: true
                pattern:
                  regex: "^https://.+"
                  message: "L'adresse doit commencer par https://"
              - name: theme
                label: Thème (par exemple « Démarches »)
                type: string
                required: true

  - name: decouvrir
    label: Découvrir Ajat
    type: collection
    path: src/content/pages/decouvrir
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
        options:
          minlength: 3
          maxlength: 120
      - name: description
        label: Résumé (une phrase)
        type: text
        options:
          maxlength: 200
      - name: order
        label: Ordre d'affichage (1 = en premier)
        type: number
      - name: draft
        label: Brouillon (ne pas publier)
        type: boolean
        default: true
      - name: body
        label: Texte
        type: rich-text
        options:
          format: markdown
          media: images-texte
          path: public/images
          extensions: [jpg, jpeg, png, webp]
          rename: safe

  - name: visuel-accueil
    label: Visuel d'accueil
    type: file
    path: src/content/donnees/visuels.yml
    format: yaml
    fields:
      - name: accueil
        label: Photo de la page d'accueil
        type: object
        fields:
          - name: image
            label: Photo
            type: image
            options:
              media: couvertures
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: alt
            label: Description de la photo
            type: text
            required: true
            description: Dites ce que montre la photo, en une phrase (10 à 160 caractères).
            options:
              minlength: 10
              maxlength: 160
          - name: credit
            label: Crédit de la photo (facultatif pour une photo de la mairie)
            type: object
            fields:
              - name: author
                label: Auteur
                type: string
              - name: license
                label: Licence (par exemple « CC BY-SA 4.0 »)
                type: string
              - name: licenseUrl
                label: Adresse de la licence (commence par https://)
                type: string
                pattern:
                  regex: "^(https://.+)?$"
                  message: "L'adresse doit commencer par https://"
              - name: sourceUrl
                label: Adresse de la page d'origine de la photo
                type: string
                pattern:
                  regex: "^(https://.+)?$"
                  message: "L'adresse doit commencer par https://"
              - name: modified
                label: La photo a été recadrée ou compressée
                type: boolean
                default: true

  - name: mairie
    label: Horaires et contact de la mairie
    type: file
    path: src/content/donnees/mairie.yml
    format: yaml
    fields:
      - name: mairie
        label: Mairie
        type: object
        fields:
          - name: name
            label: Nom
            type: string
            required: true
          - name: address
            label: Adresse
            type: object
            fields:
              - name: street
                label: Rue ou lieu-dit
                type: string
                required: true
              - name: postalCode
                label: Code postal
                type: string
                required: true
                pattern:
                  regex: "^[0-9]{5}$"
                  message: "5 chiffres, par exemple 24210"
              - name: city
                label: Commune
                type: string
                required: true
          - name: phone
            label: Téléphone
            type: string
            required: true
            pattern:
              regex: "^0[0-9]( ?[0-9]{2}){4}$"
              message: "Numéro à 10 chiffres, par exemple 05 53 00 00 00"
          - name: email
            label: Courriel
            type: string
            required: true
          - name: hours
            label: Horaires d'ouverture
            description: Ajoutez une plage par période d'ouverture (par exemple 09:00 à 12:00). Aucune plage = fermé.
            type: object
            fields:
              - name: lundi
                label: Lundi
                type: object
                list: true
                fields: &plage
                  - name: open
                    label: Ouverture (HH:MM)
                    type: string
                    required: true
                    pattern:
                      regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                      message: "Heure au format HH:MM, par exemple 09:00"
                  - name: close
                    label: Fermeture (HH:MM)
                    type: string
                    required: true
                    pattern:
                      regex: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
                      message: "Heure au format HH:MM, par exemple 12:00"
              - { name: mardi, label: Mardi, type: object, list: true, fields: *plage }
              - { name: mercredi, label: Mercredi, type: object, list: true, fields: *plage }
              - { name: jeudi, label: Jeudi, type: object, list: true, fields: *plage }
              - { name: vendredi, label: Vendredi, type: object, list: true, fields: *plage }
              - { name: samedi, label: Samedi, type: object, list: true, fields: *plage }
              - { name: dimanche, label: Dimanche, type: object, list: true, fields: *plage }
          - name: closures
            label: Fermetures exceptionnelles
            description: Congés, jours fériés, travaux. Elles disparaissent seules une fois la date passée.
            type: object
            list: true
            fields:
              - name: from
                label: Du
                type: date
                required: true
                options:
                  format: yyyy-MM-dd
              - name: to
                label: Au (inclus)
                type: date
                required: true
                options:
                  format: yyyy-MM-dd
              - name: reason
                label: Motif
                type: string
                required: true
          - name: hoursNote
            label: Remarque sur les horaires (facultative)
            type: text
