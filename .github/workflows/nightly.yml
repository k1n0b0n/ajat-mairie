name: Nuit

# Reconstruction quotidienne, seulement si un contenu change de statut (actualité programmée qui devient
# visible, fermeture exceptionnelle qui expire) : voir scripts/changement-du-jour.mjs. Un lancement
# manuel reconstruit toujours. Le lundi, vérification (non bloquante) des liens externes.
on:
  schedule:
    - cron: "17 2 * * *"
    - cron: "43 3 * * 1"
  workflow_dispatch:

jobs:
  verifier:
    if: github.event.schedule != '43 3 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      a_faire: ${{ steps.changement.outputs.a_faire }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - id: changement
        run: node scripts/changement-du-jour.mjs

  reconstruire:
    needs: verifier
    if: github.event_name == 'workflow_dispatch' || needs.verifier.outputs.a_faire == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  liens-externes:
    if: github.event.schedule == '43 3 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: false
