name: PR de relecture

# Chaque enregistrement de Pages CMS sur la branche « redaction » ouvre (ou garde ouverte)
# une pull request vers main : c'est elle que le relecteur approuve.
on:
  push:
    branches: [redaction]

permissions:
  contents: read
  pull-requests: write

jobs:
  ouvrir:
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir la PR si elle n'existe pas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existante=$(gh pr list --head redaction --base main --state open --json number --jq '.[0].number')
          avance=$(gh api "repos/$GH_REPO/compare/main...redaction" --jq .ahead_by)
          if [ -z "$existante" ] && [ "$avance" -gt 0 ]; then
            gh pr create --head redaction --base main \
              --title "Contenu à relire" \
              --body "Modifications de contenu enregistrées depuis Pages CMS. Ouvrez l'aperçu (commentaire ci-dessous), puis approuvez et fusionnez, ou demandez une modification. Guide : docs/aide-relecteur.md"
          fi
