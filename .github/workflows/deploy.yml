name: Déploiement

on:
  push:
    branches: [main]
    # Les changements de documentation seule ne redéploient pas (sobriété, principe IX)
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CODE_OF_CONDUCT.md
      - LICENSE
      - LICENSE-CONTENU.md
      - docs/**
      - specs/**
      - .specify/**
      - .claude/**
      - .github/ISSUE_TEMPLATE/**
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/CODEOWNERS
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Variables de dépôt facultatives : vides une fois le domaine personnalisé en place.
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BASE: ${{ vars.SITE_BASE }}
      # Indexation par les moteurs : désactivée tant que la variable INDEXATION n'est pas à « on ».
      INDEXATION: ${{ vars.INDEXATION }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 26

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
