# Texte de l'accueil, rubrique « Le village » : deux ou trois phrases sur Ajat (60 à 320 caractères).
accueil:
  village: "Ajat est un village de 307 habitants, posé sur le causse de Thenon, en Périgord noir. Son église Saint-Martin, romane, et son château des XVIe et XVIIe siècles se dressent au milieu d'un bourg de pierre blonde et de toits de tuiles brunes."
